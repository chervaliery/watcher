name: Django build and test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-dev.txt', 'requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run migrations
        run: python manage.py migrate --noinput
        env:
          DJANGO_SECRET_KEY: test-secret-for-ci
          DJANGO_DEBUG: "0"

      - name: Run Django system check
        run: python manage.py check
        env:
          DJANGO_SECRET_KEY: test-secret-for-ci
          DJANGO_DEBUG: "0"

      - name: Run tests with coverage
        run: pytest --cov=monitor --cov=watcher --cov-branch --cov-report=xml
        env:
          DJANGO_SECRET_KEY: test-secret-for-ci
          DJANGO_DEBUG: "0"
          DJANGO_SETTINGS_MODULE: watcher.settings

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
